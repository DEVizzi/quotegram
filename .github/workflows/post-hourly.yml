name: Instagram Post Every 6 Hours


on:
  schedule:
    # Monday to Sunday — 9:00 AM IST and 6:30 PM IST
   # - cron: "30 3 * * 1"  # 9:00 AM IST Monday
   # - cron: "0 13 * * 1"  # 6:30 PM IST Monday

   # - cron: "30 3 * * 2"  # 9:00 AM IST Tuesday
   # - cron: "0 13 * * 2"  # 6:30 PM IST Tuesday

  #  - cron: "30 3 * * 3"  # 9:00 AM IST Wednesday
  #  - cron: "0 13 * * 3"  # 6:30 PM IST Wednesday

  #  - cron: "30 3 * * 4"  # 9:00 AM IST Thursday
   # - cron: "0 13 * * 4"  # 6:30 PM IST Thursday

   # - cron: "30 3 * * 5"  # 9:00 AM IST Friday
  #  - cron: "0 13 * * 5"  # 6:30 PM IST Friday

   # - cron: "30 3 * * 6"  # 9:00 AM IST Saturday
  #  - cron: "0 13 * * 6"  # 6:30 PM IST Saturday

  #  - cron: "30 3 * * 0"  # 9:00 AM IST Sunday
  #  - cron: "0 13 * * 0"  # 6:30 PM IST Sunday

  workflow_dispatch:


jobs:
  post:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_FILE:          ${{ secrets.YOUTUBE_TOKEN_FILE }}
      FB_PAGE_ACCESS_TOKEN:        ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PAGE_ID:                  ${{ secrets.FB_PAGE_ID }}
      GOOGLE_API_KEY:              ${{ secrets.GOOGLE_API_KEY }}
      YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libsm6 libxrender1 libxext6

      - name: 📥 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 👟 Run Instagram & YouTube posting script
        run: |
          python post_instagram.py
