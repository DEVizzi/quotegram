name: Instagram Post Every 6 Hours

on:
  schedule:
    # Run at minute 0 every 6th hour (UTC)
    - cron: '0 */9 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_FILE:          ${{ secrets.YOUTUBE_TOKEN_FILE }}
      FB_PAGE_ACCESS_TOKEN:        ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PAGE_ID:                  ${{ secrets.FB_PAGE_ID }}
      GOOGLE_API_KEY:              ${{ secrets.GOOGLE_API_KEY }}
      YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libsm6 libxrender1 libxext6

      - name: 📥 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 👟 Run Instagram & YouTube posting script
        run: |
          python post_instagram.py
