name: Instagram Post Every 6 Hours

on:
  schedule:
    # Monday
- cron: "30 1 * * 1"  # 7:00 AM IST
- cron: "30 7 * * 1"  # 1:00 PM IST
- cron: "30 14 * * 1" # 8:00 PM IST

# Tuesday
- cron: "30 2 * * 2"  # 8:00 AM IST
- cron: "30 8 * * 2"  # 2:00 PM IST
- cron: "30 15 * * 2" # 9:00 PM IST

# Wednesday
- cron: "30 1 * * 3"  # 7:00 AM IST
- cron: "30 7 * * 3"  # 1:00 PM IST
- cron: "30 14 * * 3" # 8:00 PM IST

# Thursday
- cron: "30 2 * * 4"  # 8:00 AM IST
- cron: "30 8 * * 4"  # 2:00 PM IST
- cron: "30 15 * * 4" # 9:00 PM IST

# Friday
- cron: "30 1 * * 5"  # 7:00 AM IST
- cron: "30 7 * * 5"  # 1:00 PM IST
- cron: "30 14 * * 5" # 8:00 PM IST

# Saturday
- cron: "30 3 * * 6"  # 9:00 AM IST
- cron: "30 9 * * 6"  # 3:00 PM IST
- cron: "30 16 * * 6" # 10:00 PM IST

# Sunday
- cron: "30 2 * * 0"  # 8:00 AM IST
- cron: "30 8 * * 0"  # 2:00 PM IST
- cron: "30 15 * * 0" # 9:00 PM IST
  workflow_dispatch:


jobs:
  post:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_FILE:          ${{ secrets.YOUTUBE_TOKEN_FILE }}
      FB_PAGE_ACCESS_TOKEN:        ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PAGE_ID:                  ${{ secrets.FB_PAGE_ID }}
      GOOGLE_API_KEY:              ${{ secrets.GOOGLE_API_KEY }}
      YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libsm6 libxrender1 libxext6

      - name: 📥 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 👟 Run Instagram & YouTube posting script
        run: |
          python post_instagram.py
